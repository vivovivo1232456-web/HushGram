name: Build bundle

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # Uses the optional secret GPR_TOKEN (a classic token with read:packages) when it is set.
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList :patches:buildAndroid --no-daemon --stacktrace

      - name: Show what was built
        run: ls -la patches/build/libs

      - name: Publish the bundle as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stretch-${{ github.run_number }}
          name: Bubble stretch build ${{ github.run_number }}
          prerelease: true
          files: patches/build/libs/*.mpp
